toml
name = "linor-widget-cdn"
type = "javascript"
main = "src/worker.js"
compatibility_date = "2024-01-01"
account_id = "YOUR_ACCOUNT_ID"
workers_dev = true

[env.production]
name = "linor-widget-cdn-prod"
route = "cdn.yourdomain.com/*"
zone_id = "YOUR_ZONE_ID"
vars = { CACHE_VERSION = "1", ENVIRONMENT = "production" }

[env.staging]
name = "linor-widget-cdn-staging"
route = "staging-cdn.yourdomain.com/*"
zone_id = "YOUR_ZONE_ID"
vars = { CACHE_VERSION = "1", ENVIRONMENT = "staging" }

# Analytics Engine binding (optional)
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# KV Store for configuration (optional)
[[kv_namespaces]]
binding = "CONFIG"
id = "YOUR_KV_NAMESPACE_ID"
